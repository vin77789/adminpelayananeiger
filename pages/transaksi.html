<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etalase & Transaksi - EIGER Customer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.product-card{height:100%;transition:.2s}
.product-card:hover{transform:translateY(-4px)}
.product-image{height:210px;object-fit:cover;border-radius:12px 12px 0 0;background:#eee}
.product-price{font-size:1.1rem;font-weight:700}
.cart-sticky{position:sticky;top:20px}
.badge-stock{font-size:.75rem}
.cart-item{border-bottom:1px solid #eee;padding:12px 0}
.qty-btn{width:32px;height:32px;padding:0}
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="../dashboard.html">EIGER Customer</a>
<a class="btn btn-light btn-sm" href="../dashboard.html">Dashboard</a>
</div>
</nav>

<main class="container py-4">

<div class="hero mb-4">
<h1>Etalase Produk EIGER</h1>
<p class="mb-0">Pilih produk yang ingin Anda beli, kemudian masukkan ke keranjang.</p>
</div>

<div class="row g-4">
<div class="col-lg-8">

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
<h3 class="mb-2">Produk</h3>
<select id="filterKategori" class="form-select w-auto">
<option value="Semua">Semua Kategori</option>
<option value="Tas">Tas</option>
<option value="Jaket">Jaket</option>
<option value="Sepatu">Sepatu</option>
<option value="Aksesoris">Aksesoris</option>
</select>
</div>

<div id="productList" class="row g-3"></div>

</div>

<div class="col-lg-4">
<div class="card p-4 cart-sticky">
<h3 class="mb-3">🛒 Keranjang</h3>
<div id="cartList"></div>

<div class="border-top pt-3 mt-2">
<div class="d-flex justify-content-between">
<span>Subtotal</span>
<strong id="subtotal">Rp0</strong>
</div>
<div class="d-flex justify-content-between mt-2">
<span>Total Item</span>
<strong id="totalItem">0</strong>
</div>
</div>

<button id="checkoutBtn" class="btn btn-success w-100 mt-3">
Simpan Transaksi
</button>

<button id="clearCartBtn" class="btn btn-outline-danger w-100 mt-2">
Kosongkan Keranjang
</button>
</div>
</div>
</div>

<div class="card p-4 mt-5">
<h3>Data Pembeli</h3>
<form id="buyerForm">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Nama Customer</label>
<input id="customer" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input id="email" type="email" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Metode Pembayaran</label>
<select id="pembayaran" class="form-select" required>
<option value="">-- Pilih Pembayaran --</option>
<option>Cash</option>
<option>Transfer Bank</option>
<option>QRIS</option>
<option>Debit</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Keterangan</label>
<input id="keterangan" class="form-control">
</div>
</div>
</form>
</div>

</main>

<footer>© 2026 EIGER Customer Service</footer>

<script src="../js/transaksi.js"></script>
</body>
</html>
