<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Transaksi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="../dashboard.html">EIGER Customer</a><a class="btn btn-light btn-sm" href="../dashboard.html">Dashboard</a></div></nav><main class="container py-4"><div class="card p-4"><h2 class="mb-4">Riwayat Transaksi Saya</h2><div class="table-responsive"><table class="table table-bordered table-striped"><thead class="table-success"><tr><th>No</th><th>Tanggal</th><th>Barang</th><th>Jumlah</th><th>Total</th><th>Pembayaran</th></tr></thead><tbody id="table"></tbody></table></div></div></main><script>if(localStorage.getItem("customerLogin")!=="true")location.replace("../index.html");const u=localStorage.getItem("customerUsername"),d=JSON.parse(localStorage.getItem("customerTransaksi")||"[]").filter(x=>x.customerUsername===u);function rp(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",minimumFractionDigits:0}).format(n)}document.getElementById("table").innerHTML=d.length?d.map((x,i)=>`<tr><td>${i+1}</td><td>${x.tanggal}</td><td>${x.barang}</td><td>${x.jumlah}</td><td>${rp(x.total)}</td><td>${x.pembayaran}</td></tr>`).join(""):`<tr><td colspan="6" class="text-center">Belum ada data.</td></tr>`;</script></body></html>
