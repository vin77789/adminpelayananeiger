<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelayanan Customer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="../dashboard.html">EIGER Customer</a><a class="btn btn-light btn-sm" href="../dashboard.html">Dashboard</a></div></nav><main class="container py-4"><div class="card p-4"><h2 class="text-center mb-4">Pengajuan Pelayanan</h2><form id="serviceForm"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Nama</label><input id="nama" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">No. HP</label><input id="telepon" class="form-control"></div><div class="col-md-6 mb-3"><label class="form-label">Jenis Pelayanan</label><select id="layanan" class="form-select" required><option value="">-- Pilih --</option><option>Pengaduan</option><option>Konsultasi</option><option>Permintaan Informasi</option><option>Keluhan Produk</option></select></div><div class="col-12 mb-3"><label class="form-label">Deskripsi</label><textarea id="deskripsi" rows="4" class="form-control" required></textarea></div></div><button class="btn btn-primary w-100">Simpan Pengajuan</button></form></div></main><script src="../js/pelayanan.js"></script></body></html>
