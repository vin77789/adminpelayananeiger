<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin - EIGER</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body class="bg-dark"><main class="container min-vh-100 d-flex align-items-center justify-content-center"><div class="card border-0 shadow p-4 p-md-5" style="max-width:430px;width:100%;border-radius:16px"><div class="text-center mb-4"><h2 class="fw-bold">EIGER ADMIN</h2><p class="text-secondary">Sistem Manajemen Toko</p></div><form id="loginForm"><div class="mb-3"><label class="form-label">Username</label><input id="username" class="form-control" required></div><div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div><button class="btn btn-dark w-100">Login Admin</button></form><div id="error" class="alert alert-danger mt-3 d-none">Username atau password salah.</div><p class="small text-center text-secondary mt-3 mb-0">Demo: admin / admin123</p><a href="../index.html" class="small text-center mt-3">Kembali ke Login Customer</a></div></main><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();if(username.value.trim()==='admin'&&password.value==='admin123'){localStorage.setItem('eigerAdminLogin','true');location.href='dashboard.html'}else error.classList.remove('d-none')});</script></body></html>
