<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barang & Diskon - EIGER Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><nav class="navbar navbar-expand-lg navbar-dark admin-nav"><div class="container"><a class="navbar-brand" href="dashboard.html">EIGER ADMIN</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#adminNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="adminNav"><div class="navbar-nav ms-auto"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="transaksi.html">Status Transaksi</a><a class="nav-link" href="retur.html">Status Retur</a><a class="nav-link" href="produk.html">Barang & Diskon</a><button class="btn btn-outline-light btn-sm ms-lg-3" onclick="logoutAdmin()">Logout</button></div></div></div></nav><main class="container admin-wrap"><div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small">EIGER STORE MANAGEMENT</div><h1 class="admin-title h2 mb-0">Barang & Diskon</h1></div><span class="badge text-bg-light p-2" id="dateNow"></span></div><div class="row g-4"><div class="col-lg-4"><div class="card admin-card p-4"><h5 class="section-title">Tambah / Edit Barang</h5><form id="productForm"><input type="hidden" id="editId"><div class="mb-3"><label class="form-label">Nama Barang</label><input id="nama" class="form-control" required></div><div class="mb-3"><label class="form-label">Kategori</label><select id="kategori" class="form-select"><option>Tas</option><option>Jaket</option><option>Sepatu</option><option>Aksesoris</option></select></div><div class="row"><div class="col-6 mb-3"><label class="form-label">Harga (Rp)</label><input id="harga" type="number" min="0" class="form-control" required></div><div class="col-6 mb-3"><label class="form-label">Stok</label><input id="stok" type="number" min="0" class="form-control" required></div></div><div class="mb-3"><label class="form-label">Diskon (%)</label><input id="diskon" type="number" min="0" max="100" value="0" class="form-control"></div><div class="mb-3"><label class="form-label">URL Foto</label><input id="gambar" type="url" class="form-control" placeholder="https://..."></div><div class="mb-3"><label class="form-label">Deskripsi</label><textarea id="deskripsi" class="form-control" rows="2"></textarea></div><button class="btn btn-dark w-100" id="saveBtn">Simpan Barang</button><button type="button" class="btn btn-outline-secondary w-100 mt-2" onclick="resetForm()">Reset Form</button></form></div></div><div class="col-lg-8"><div class="card admin-card p-4"><div class="d-flex justify-content-between mb-3"><h5 class="section-title">Katalog Produk</h5><span class="badge text-bg-success" id="count"></span></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Diskon</th><th>Aksi</th></tr></thead><tbody id="productRows"></tbody></table></div></div></div></div></main><script>if(localStorage.getItem('eigerAdminLogin')!=='true')location.replace('index.html');function logoutAdmin(){localStorage.removeItem('eigerAdminLogin');location.href='index.html'}function read(k){return JSON.parse(localStorage.getItem(k)||'[]')}function rp(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('dateNow').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="produk.js"></script></body></html>
